# flwr run 
name: CI - FLWR Train

on:
  push:
    branches:
      - feature_manjusha
      - main
    paths:
      - 'PoC/Model-Pipeline/himas-model-pipeline/**'
      - '.github/workflows/ci-flwr-train.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-train-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PoC/Model-Pipeline/himas-model-pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (jq, bc, gcloud)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc
          curl -sSL https://sdk.cloud.google.com | bash >/dev/null
          echo "${HOME}/.google-cloud-sdk/bin" >> $GITHUB_PATH

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install .

      - name: Train (Flower)
        run: flwr run .

      - name: Authenticate to GCP for BigQuery access
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          echo "$GCP_SA_KEY" > sa-key.json
          gcloud auth activate-service-account --key-file=sa-key.json
          gcloud config set project "$GCP_PROJECT_ID"

      - name: Evaluate Model (with BigQuery auth)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          echo "$GCP_SA_KEY" > sa-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=sa-key.json
          echo "✅ Using GCP project: $GCP_PROJECT_ID"
          python evaluate_model.py

      - name: Validate metrics thresholds (accuracy + recall)
        run: |
          ACC=$(jq '.[] | select(.hospital=="AGGREGATED") | .accuracy' evaluation_results/*.json)
          REC=$(jq '.[] | select(.hospital=="AGGREGATED") | .recall' evaluation_results/*.json)
          echo "Aggregated accuracy: $ACC"
          echo "Aggregated recall  : $REC"
          ACC_T=0.85
          REC_T=0.60
          FAIL=false
          if (( $(echo "$ACC < $ACC_T" | bc -l) )); then echo "❌ Accuracy $ACC < $ACC_T"; FAIL=true; fi
          if (( $(echo "$REC < $REC_T" | bc -l) )); then echo "❌ Recall $REC < $REC_T"; FAIL=true; fi
          if [ "$FAIL" = true ]; then echo "Stopping due to thresholds"; exit 1; fi
          echo "✅ Thresholds passed"

      - name: Bias detection across hospitals
        run: |
          AGG_ACC=$(jq '.[] | select(.hospital=="AGGREGATED") | .accuracy' evaluation_results/*.json)
          AGG_REC=$(jq '.[] | select(.hospital=="AGGREGATED") | .recall' evaluation_results/*.json)
          ACC_TOL=0.05
          REC_TOL=0.07
          FAIL=false
          jq -c '.[] | select(.hospital!="AGGREGATED")' evaluation_results/*.json | while read -r row; do
            H=$(echo "$row" | jq -r '.hospital')
            ACC=$(echo "$row" | jq -r '.accuracy')
            REC=$(echo "$row" | jq -r '.recall')
            A_DIFF=$(echo "$AGG_ACC - $ACC" | bc -l)
            R_DIFF=$(echo "$AGG_REC - $REC" | bc -l)
            A_ABS=$(awk -v x="$A_DIFF" 'BEGIN{print (x<0?-x:x)}')
            R_ABS=$(awk -v x="$R_DIFF" 'BEGIN{print (x<0?-x:x)}')
            echo "Slice $H → |Δacc|=$A_ABS | |Δrec|=$R_ABS"
            if (( $(echo "$A_ABS > $ACC_TOL" | bc -l) )); then echo "⚠️ Accuracy bias for $H"; FAIL=true; fi
            if (( $(echo "$R_ABS > $REC_TOL" | bc -l) )); then echo "⚠️ Recall bias for $H"; FAIL=true; fi
          done
          if [ "$FAIL" = true ]; then echo "🚫 Bias check failed"; exit 1; fi
          echo "✅ Bias check passed"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: |
            PoC/Model-Pipeline/himas-model-pipeline/evaluation_results/**
            PoC/Model-Pipeline/himas-model-pipeline/models/**

      - name: Upload Model to GCS (Model Registry Push)
        if: success()
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > sa-key.json
          gcloud auth activate-service-account --key-file=sa-key.json
          gcloud config set project "$GCP_PROJECT_ID"

          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          MODEL_PATH="models/himas_federated_mortality_model.keras"
          DEST_PATH="gs://himas-mlops-models/model_${TIMESTAMP}.keras"
          echo "📦 Uploading $MODEL_PATH to $DEST_PATH ..."
          gsutil cp "$MODEL_PATH" "$DEST_PATH"
          echo "✅ Model uploaded to $DEST_PATH"
