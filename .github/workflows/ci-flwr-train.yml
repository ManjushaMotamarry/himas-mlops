name: CI - Flower Model Pipeline

on:
  push:
    branches: [ main, feature_manjusha ]
  pull_request:
    branches: [ main, feature_manjusha ]

permissions:
  contents: read
  id-token: write

jobs:
  build-train-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: PoC/Model-Pipeline/himas-model-pipeline
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install .

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc
          curl -sSL https://sdk.cloud.google.com | bash >/dev/null
          echo "${HOME}/google-cloud-sdk/bin" >> $GITHUB_PATH

      # CRITICAL: Set up GCP auth BEFORE training
      - name: Authenticate to GCP
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "$GCP_SA_KEY" ] || [ -z "$GCP_PROJECT_ID" ]; then
            echo "❌ GCP secrets missing!"
            exit 1
          fi
          
          cd $GITHUB_WORKSPACE
          
          # Create credentials file
          echo "$GCP_SA_KEY" > gcp-sa-key.json
          
          # Authenticate gcloud
          gcloud auth activate-service-account --key-file=gcp-sa-key.json
          gcloud config set project "$GCP_PROJECT_ID"
          
          # CRITICAL: Export to $GITHUB_ENV so it persists to next steps
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/gcp-sa-key.json" >> $GITHUB_ENV
          echo "GCP_PROJECT_ID=$GCP_PROJECT_ID" >> $GITHUB_ENV
          
          echo "✅ Credentials configured at: $GITHUB_WORKSPACE/gcp-sa-key.json"
          ls -lh gcp-sa-key.json

      # Run training with credentials available
      - name: Run federated training
        working-directory: PoC/Model-Pipeline/himas-model-pipeline
        run: |
          echo "🚀 Starting Flower training..."
          echo "🔐 Using credentials: $GOOGLE_APPLICATION_CREDENTIALS"
          
          # Verify credentials are accessible
          if [ ! -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "❌ Credentials file not found!"
            exit 1
          fi
          
          flwr run . 2>&1 | tee ../../../flower_training.log
          EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Training failed with exit code $EXIT_CODE"
            echo "📋 Last 100 lines:"
            tail -100 ../../../flower_training.log
            exit 1
          fi
          
          echo "✅ Training completed"

      - name: Upload training logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-logs
          path: flower_training.log

      - name: Verify model was saved
        working-directory: PoC/Model-Pipeline/himas-model-pipeline
        run: |
          echo "🔍 Checking for model file..."
          if [ -f "models/himas_federated_mortality_model.keras" ]; then
            echo "✅ Model exists!"
            ls -lh models/himas_federated_mortality_model.keras
          else
            echo "❌ Model not found!"
            echo "📂 Contents of models/ directory:"
            ls -lah models/ || echo "models/ doesn't exist"
            
            echo ""
            echo "📋 Checking training log for errors:"
            grep -A 20 "Saving final model" ../../../flower_training.log || echo "Not in log"
            
            exit 1
          fi

      - name: Evaluate model
        working-directory: PoC/Model-Pipeline/himas-model-pipeline
        run: |
          mkdir -p evaluation_results
          python evaluate_model.py

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: PoC/Model-Pipeline/himas-model-pipeline/evaluation_results/

      - name: Validate model performance thresholds
        working-directory: PoC/Model-Pipeline/himas-model-pipeline
        run: |
          echo "🔍 Validating model metrics..."

          ACCURACY=$(jq '.[] | select(.hospital=="AGGREGATED") | .accuracy' evaluation_results/*.json)
          RECALL=$(jq '.[] | select(.hospital=="AGGREGATED") | .recall' evaluation_results/*.json)

          echo "Accuracy: $ACCURACY | Recall: $RECALL"

          ACC_THRESHOLD=0.85
          REC_THRESHOLD=0.60
          FAIL=false

          if (( $(echo "$ACCURACY < $ACC_THRESHOLD" | bc -l) )); then
            echo "❌ Accuracy below threshold"
            FAIL=true
          fi

          if (( $(echo "$RECALL < $REC_THRESHOLD" | bc -l) )); then
            echo "❌ Recall below threshold"
            FAIL=true
          fi

          if [ "$FAIL" = true ]; then
            exit 1
          fi
          
          echo "✅ All thresholds passed"

      - name: Bias detection
        working-directory: PoC/Model-Pipeline/himas-model-pipeline
        run: |
          AGG_ACC=$(jq '.[] | select(.hospital=="AGGREGATED") | .accuracy' evaluation_results/*.json)
          AGG_REC=$(jq '.[] | select(.hospital=="AGGREGATED") | .recall' evaluation_results/*.json)
          
          ACC_TOL=0.05
          REC_TOL=0.07
          FAIL=false
          
          jq -c '.[] | select(.hospital!="AGGREGATED")' evaluation_results/*.json | while read -r row; do
            H=$(echo "$row" | jq -r '.hospital')
            ACC=$(echo "$row" | jq -r '.accuracy')
            REC=$(echo "$row" | jq -r '.recall')
            
            A_DIFF=$(echo "$AGG_ACC - $ACC" | bc -l)
            R_DIFF=$(echo "$AGG_REC - $REC" | bc -l)
            A_ABS=$(awk -v x="$A_DIFF" 'BEGIN{print (x<0?-x:x)}')
            R_ABS=$(awk -v x="$R_DIFF" 'BEGIN{print (x<0?-x:x)}')
            
            echo "Hospital $H → |Δacc|=$A_ABS | |Δrec|=$R_ABS"
            
            if (( $(echo "$A_ABS > $ACC_TOL" | bc -l) )); then
              echo "⚠️ Accuracy bias: $H"
              FAIL=true
            fi
            
            if (( $(echo "$R_ABS > $REC_TOL" | bc -l) )); then
              echo "⚠️ Recall bias: $H"
              FAIL=true
            fi
          done
          
          [ "$FAIL" = true ] && exit 1 || echo "✅ Bias check passed"

      - name: Upload to GCS
        if: success() && github.event_name == 'push'
        working-directory: PoC/Model-Pipeline/himas-model-pipeline
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          gsutil cp models/himas_federated_mortality_model.keras gs://himas-mlops-models/model_${TIMESTAMP}.keras
          echo "✅ Uploaded to GCS"